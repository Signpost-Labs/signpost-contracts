name: Soroban Contract CI
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        targets: wasm32v1-none
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target

          '
        key: ${{ runner.os }}-cargo-wasm32v1-${{ hashFiles('**/Cargo.lock') }}
    - name: Pin ed25519-dalek to fix soroban-env-host trait bound error
      run: cargo update -p ed25519-dalek@3.0.0 --precise 3.0.0-rc.0 || true
    - name: Run tests
      run: cargo test --workspace --locked
    - name: Test progress contract
      run: cargo test -p promiscope-progress --locked -- --nocapture
    - name: CPU-instruction cost budget report
      run: "set -euo pipefail\ncargo test --workspace --locked --test cost_budget\
        \ -- --nocapture --test-threads=1 \\\n  | tee cpu-cost-budget-report.txt\n"
    - name: Upload CPU-cost budget report artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpu-cost-budget-${{ github.sha }}
        path: cpu-cost-budget-report.txt
        if-no-files-found: error
    - name: Build WASM (release)
      run: cargo build --workspace --target wasm32v1-none --release --locked
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python for normalization tests
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python test dependency
      run: python3 -m pip install pytest==8.3.3
    - name: Test region and position normalization
      run: python3 -m pytest scripts/tests/test_migrate_region.py
    - uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt
    - name: Clippy
      run: cargo clippy --workspace -- -D warnings
    - name: Format check
      run: cargo fmt --all -- --check
    - name: Shell script lint (shellcheck)
      run: 'sudo apt-get install -y shellcheck

        shellcheck scripts/deploy.sh

        shellcheck scripts/initialize.sh

        shellcheck scripts/setup-testnet.sh

        shellcheck scripts/generate-bindings.sh

        shellcheck scripts/check-bindings.sh

        shellcheck scripts/health-check.sh

        shellcheck scripts/full-readiness-check.sh

        shellcheck scripts/smoke-test.sh

        shellcheck scripts/rollback.sh

        shellcheck scripts/emergency-pause.sh

        shellcheck scripts/emergency-unpause.sh

        shellcheck scripts/migrate-contract.sh

        shellcheck scripts/replay-state.sh

        shellcheck scripts/migrate-contract-smoke-test.sh

        shellcheck scripts/git-hooks/pre-push

        shellcheck testnet/seed.sh

        shellcheck scripts/check-event-topic-consistency.sh

        shellcheck scripts/check-guard-ordering.sh

        shellcheck scripts/check-cross-doc-consistency.sh

        shellcheck scripts/check-trial-offer-flow-consistency.sh

        shellcheck scripts/check-error-code-continuity.sh

        shellcheck scripts/check-cargo-doc.sh

        shellcheck scripts/check-migration-numbering.sh

        '
    - name: Docs completeness check
      run: bash scripts/check-docs.sh
    - name: Event-topic consistency check
      run: bash scripts/check-event-topic-consistency.sh
    - name: Guard-ordering audit
      run: bash scripts/check-guard-ordering.sh
    - name: Cross-doc consistency check
      run: bash scripts/check-cross-doc-consistency.sh
    - name: Trial-offer flow doc consistency check
      run: bash scripts/check-trial-offer-flow-consistency.sh
    - name: Error-code continuity check
      run: bash scripts/check-error-code-continuity.sh
    - name: Cargo doc missing-documentation check
      run: bash scripts/check-cargo-doc.sh
    - name: Migration numbering check
      run: bash scripts/check-migration-numbering.sh
    - name: Validate bindings package.json templates
      run: bash scripts/check-bindings.sh
    - name: Storage-layout compatibility regression tests
      run: bash scripts/tests/check-storage-layout-compat.test.sh
  bindings-smoke-test:
    name: Bindings smoke-test (local sandbox)
    runs-on: ubuntu-latest
    needs: test
    env:
      STELLAR_SOURCE_ACCOUNT: ci-deployer
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        targets: wasm32v1-none
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target

          '
        key: ${{ runner.os }}-cargo-wasm32v1-${{ hashFiles('**/Cargo.lock') }}
    - name: Install Stellar CLI (pinned)
      run: '# Keep in sync with: docs/CONTRIBUTING.md, scripts/generate-bindings.sh,
        and the abi-export CI step

        STELLAR_CLI_VERSION="28.0.0"

        curl -sSL "https://raw.githubusercontent.com/stellar/stellar-cli/v${STELLAR_CLI_VERSION}/install.sh"
        | bash

        echo "$HOME/.stellar/bin" >> "$GITHUB_PATH"

        '
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build WASM contracts
      run: cargo build --workspace --target wasm32v1-none --release --locked
    - name: Start Soroban local sandbox
      run: "docker run -d \\\n  --name stellar-local \\\n  -p 8000:8000 \\\n  stellar/quickstart:testing\
        \ \\\n  --local \\\n  --limits unlimited\n# `--limits unlimited` raises the\
        \ local network's Soroban resource\n# ceilings. The stellar-core default limits\
        \ are extremely low and\n# reject the upload of `verification`'s ~134 KB optimized\
        \ WASM with\n# `HostError: Error(Budget, ExceededLimit)` at simulation time.\n\
        # Poll getLatestLedger until the DB is initialised and returns\n# a real ledger\
        \ sequence (not just an open TCP port).\necho \"Waiting for Soroban RPC to\
        \ be ready...\"\nfor i in $(seq 1 60); do\n  LEDGER=$(curl -sf http://localhost:8000/soroban/rpc\
        \ \\\n    -X POST \\\n    -H 'Content-Type: application/json' \\\n    -d '{\"\
        jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getLatestLedger\"}' \\\n    2>/dev/null\
        \ \\\n    | python3 -c \"import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('sequence',0))\"\
        \ \\\n    2>/dev/null || echo 0)\n  if [ \"${LEDGER:-0}\" -gt 0 ] 2>/dev/null;\
        \ then\n    echo \"RPC ready — ledger ${LEDGER} after ${i}s\"\n    break\n\
        \  fi\n  sleep 2\ndone\nif [ \"${LEDGER:-0}\" -eq 0 ] 2>/dev/null; then\n\
        \  echo \"ERROR: Soroban RPC never became ready\"\n  docker logs stellar-local\n\
        \  exit 1\nfi\n"
    - name: Register local network with Stellar CLI
      run: "stellar network add local \\\n  --rpc-url http://localhost:8000/soroban/rpc\
        \ \\\n  --network-passphrase \"Standalone Network ; February 2017\"\n"
    - name: Generate a local sandbox identity
      run: 'stellar keys generate ci-deployer --network local

        echo "ADMIN_ADDRESS=$(stellar keys address ci-deployer)" >> "$GITHUB_ENV"

        '
    - name: Fund the sandbox identity
      run: "set -euo pipefail\n# `keys generate --fund` swallows funding errors (logs\
        \ a warning and\n# still exits 0), so fund separately with `keys fund`, which\n\
        # propagates failures, and retry since friendbot/Horizon can lag\n# behind\
        \ the RPC endpoint becoming ready.\nfor i in $(seq 1 30); do\n  if stellar\
        \ keys fund ci-deployer --network local; then\n    exit 0\n  fi\n  echo \"\
        Friendbot not ready yet, retrying (${i}/30)...\"\n  sleep 2\ndone\necho \"\
        ERROR: unable to fund ci-deployer after retries\"\nexit 1\n"
    - name: Deploy all contracts to local sandbox
      run: "set -euo pipefail\nWASM=target/wasm32v1-none/release\n\ndeploy_one() {\n\
        \  local name=\"$1\"\n  local wasm_src=\"$WASM/promiscope_${name}.wasm\"\n\
        \  local wasm_opt=\"$WASM/promiscope_${name}.optimized.wasm\"\n  # Use the\
        \ current non-deprecated build+optimize path\n  stellar contract build \\\n\
        \    --package \"promiscope-${name//_/-}\" \\\n    --optimize \\\n    --target-dir\
        \ target \\\n    > /dev/null 2>&1 \\\n    || stellar contract optimize \\\n\
        \         --wasm \"$wasm_src\" \\\n         --wasm-out \"$wasm_opt\" \\\n\
        \         > /dev/null 2>&1 \\\n    || cp \"$wasm_src\" \"$wasm_opt\"\n  stellar\
        \ contract deploy \\\n    --wasm \"$wasm_opt\" \\\n    --source ci-deployer\
        \ \\\n    --network local | grep -oE 'C[A-Z0-9]{55}' | tail -1\n}\n\nREG_ID=$(deploy_one\
        \ registration)\nVER_ID=$(deploy_one verification)\nPRG_ID=$(deploy_one progress)\n\
        SCO_ID=$(deploy_one scout_access)\n\n[ -n \"$REG_ID\" ] || { echo \"ERROR:\
        \ empty registration ID\"; exit 1; }\n[ -n \"$VER_ID\" ] || { echo \"ERROR:\
        \ empty verification ID\"; exit 1; }\n[ -n \"$PRG_ID\" ] || { echo \"ERROR:\
        \ empty progress ID\"; exit 1; }\n[ -n \"$SCO_ID\" ] || { echo \"ERROR: empty\
        \ scout_access ID\"; exit 1; }\n\n{\n  echo \"REGISTRATION_CONTRACT_ID=$REG_ID\"\
        \n  echo \"VERIFICATION_CONTRACT_ID=$VER_ID\"\n  echo \"PROGRESS_CONTRACT_ID=$PRG_ID\"\
        \n  echo \"SCOUT_ACCESS_CONTRACT_ID=$SCO_ID\"\n} > .env.contracts\n\necho\
        \ \"==> Deployed contract IDs:\"\ncat .env.contracts\n"
    - name: Initialize contracts and wire cross-contract links
      run: "set -euo pipefail\n# Source the deployed contract IDs and derive admin\
        \ address.\nsource .env.contracts\nADMIN_ADDRESS=$(stellar keys address ci-deployer)\n\
        export ADMIN_ADDRESS\n# scout_access.initialize probes the supplied xlm_token\
        \ with a\n# read-only `decimals()` call, so the native-asset Stellar Asset\n\
        # Contract must actually be deployed on this fresh local network\n# first\
        \ (a hard-coded id points at an instance that doesn't exist\n# yet -> Error(Storage,\
        \ MissingValue) -> InvalidInput). `asset\n# deploy` errors if it is already\
        \ deployed, so fall back to the\n# deterministic id.\nXLM_TOKEN_ADDRESS=\"\
        $(stellar contract asset deploy \\\n  --asset native --source ci-deployer\
        \ --network local 2>/dev/null \\\n  || stellar contract id asset --asset native\
        \ --network local)\"\nexport XLM_TOKEN_ADDRESS\necho \"Native asset SAC: $XLM_TOKEN_ADDRESS\"\
        \nDEPLOYER_SECRET=\"$(stellar keys show ci-deployer 2>/dev/null || true)\"\
        \nexport DEPLOYER_SECRET\nbash scripts/initialize.sh local\n"
    - name: Verify cross-contract wiring
      run: bash scripts/verify-cross-contract-wiring.sh local
    - name: Run health-check.sh against local sandbox
      run: bash scripts/health-check.sh local
    - name: Run full-readiness-check.sh (combined health + wiring verification)
      run: bash scripts/full-readiness-check.sh local
    - name: Run smoke-test.sh against local sandbox
      run: 'set -euo pipefail

        # ADMIN_ADDRESS was persisted to $GITHUB_ENV in the "Generate a

        # local sandbox identity" step above. DEPLOYER_SECRET is re-derived

        # here since it was only exported within the "Initialize contracts"

        # step''s own process and doesn''t carry over between steps.

        export DEPLOYER_SECRET="$(stellar keys show ci-deployer 2>/dev/null || true)"

        bash scripts/smoke-test.sh local

        '
    - name: Generate TypeScript bindings
      run: bash scripts/generate-bindings.sh local
    - name: Verify bindings output structure
      run: "set -euo pipefail\nfor pkg in registration verification progress scout_access;\
        \ do\n  dir=\"bindings/$pkg\"\n  echo \"Checking $dir...\"\n  [ -f \"$dir/src/index.ts\"\
        \ ] \\\n    || { echo \"ERROR: $dir/src/index.ts not found — generation failed\"\
        ; exit 1; }\n  echo \"  OK: src/index.ts present\"\ndone\n"
    - name: Build all binding packages
      run: "set -euo pipefail\nfor pkg in registration verification progress scout_access;\
        \ do\n  echo \"==> Building bindings/$pkg...\"\n  (cd \"bindings/$pkg\" &&\
        \ npm install && npm run build)\n  [ -f \"bindings/$pkg/dist/index.js\" ]\
        \ \\\n    || { echo \"ERROR: bindings/$pkg/dist/index.js not produced\"; exit\
        \ 1; }\n  echo \"  OK: dist/index.js present\"\ndone\n"
    - name: Verify ABI function coverage in generated bindings
      run: "set -euo pipefail\nWASM=target/wasm32v1-none/release\nmkdir -p abi-smoke\n\
        \nfailed=0\n\nfor contract in registration verification progress scout_access;\
        \ do\n  wasm=\"${WASM}/promiscope_${contract}.wasm\"\n  abi_file=\"abi-smoke/${contract}-abi.json\"\
        \n  index_ts=\"bindings/${contract}/src/index.ts\"\n\n  echo \"==> Checking\
        \ ABI coverage for ${contract}...\"\n\n  # Extract ABI JSON from the WASM.\n\
        \  stellar contract info interface --wasm \"$wasm\" --output json-formatted\
        \ \\\n    > \"$abi_file\" 2>/dev/null \\\n    || { echo \"  WARN: ABI extraction\
        \ failed for ${contract} — skipping\"; continue; }\n\n  # Compare ABI function\
        \ names against binding exports using Python.\n  python3 - \"$abi_file\" \"\
        $index_ts\" \"$contract\" <<'PYEOF'\nimport json\nimport re\nimport sys\n\n\
        abi_path, index_ts_path, contract_name = sys.argv[1], sys.argv[2], sys.argv[3]\n\
        \n# Parse ABI: collect all top-level function names.\nwith open(abi_path)\
        \ as f:\n    abi = json.load(f)\n\nabi_functions = set()\n# stellar contract\
        \ info --output json-formatted returns a list of\n# interface entries; each\
        \ entry with \"type\": \"function\" has a \"name\".\nentries = abi if isinstance(abi,\
        \ list) else abi.get(\"contract\", [])\nfor entry in entries:\n    if isinstance(entry,\
        \ dict) and entry.get(\"type\") == \"function\":\n        name = entry.get(\"\
        name\")\n        if name:\n            abi_functions.add(name)\n\nif not abi_functions:\n\
        \    print(f\"  WARN: no functions found in ABI for {contract_name} — skipping\
        \ coverage check\")\n    sys.exit(0)\n\n# Parse src/index.ts: collect exported\
        \ method names.\n# The generated binding exports a Client class; each public\
        \ method\n# declaration covers one contract function.  We scan for both:\n\
        #   async methodName(   — async contract invocations\n#   methodName(    \
        \     — sync / query methods\nwith open(index_ts_path) as f:\n    ts_source\
        \ = f.read()\n\n# Match exported method names from the Client class body.\n\
        # Pattern: optional \"async\", then the method name, then \"(\"\nbinding_methods\
        \ = set(\n    re.findall(r'(?:async\\s+)?(\\w+)\\s*\\(', ts_source)\n)\n\n\
        # Filter out JS built-ins and constructor\nignored = {\"constructor\", \"\
        call\", \"apply\", \"bind\", \"toString\", \"valueOf\"}\nbinding_methods -=\
        \ ignored\n\nmissing = abi_functions - binding_methods\nif missing:\n    print(f\"\
        \  FAIL [{contract_name}]: binding is missing exports for these ABI functions:\"\
        )\n    for fn in sorted(missing):\n        print(f\"    - {fn}\")\n    sys.exit(1)\n\
        \nprint(f\"  OK [{contract_name}]: all {len(abi_functions)} ABI function(s)\
        \ are covered by the binding\")\nPYEOF\n  rc=$?\n  if [ $rc -ne 0 ]; then\n\
        \    failed=1\n  fi\ndone\n\nif [ $failed -ne 0 ]; then\n  echo \"\"\n  echo\
        \ \"ERROR: one or more binding packages are missing exports for ABI-declared\
        \ functions.\"\n  echo \"Regenerate the bindings with: ./scripts/generate-bindings.sh\
        \ <network>\"\n  exit 1\nfi\necho \"\"\necho \"All binding packages fully\
        \ cover their contract ABIs.\"\n"
    - name: Run migration smoke test against local sandbox
      continue-on-error: true
      run: 'set -euo pipefail

        # The migration smoke test starts its own quickstart container on

        # port 8000, so free the port the earlier "Start Soroban local

        # sandbox" step is still holding.

        docker rm -f stellar-local >/dev/null 2>&1 || true

        bash scripts/migrate-contract-smoke-test.sh

        '
    - name: Stop local sandbox
      if: always()
      run: docker stop stellar-local && docker rm stellar-local || true
    - name: Docs completeness check
      run: bash scripts/check-docs.sh
  abi-export:
    name: Export Contract ABIs
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32v1-none
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target

          '
        key: ${{ runner.os }}-cargo-wasm32v1-${{ hashFiles('**/Cargo.lock') }}
    - name: Build WASM (release)
      run: cargo build --workspace --target wasm32v1-none --release --locked
    - name: Install Stellar CLI (pinned)
      run: '# Keep in sync with: docs/CONTRIBUTING.md, scripts/generate-bindings.sh,
        and the bindings-smoke-test CI step

        STELLAR_CLI_VERSION="28.0.0"

        curl -sSL "https://raw.githubusercontent.com/stellar/stellar-cli/v${STELLAR_CLI_VERSION}/install.sh"
        | bash

        echo "$HOME/.stellar/bin" >> "$GITHUB_PATH"

        '
    - name: Export contract ABIs
      run: "set -euo pipefail\nmkdir -p abi\nWASM=target/wasm32v1-none/release\nfor\
        \ contract in registration verification progress scout_access; do\n  wasm=\"\
        ${WASM}/promiscope_${contract}.wasm\"\n  out=\"abi/${contract}-abi.json\"\n\
        \  echo \"==> Inspecting ${contract}...\"\n  stellar contract info interface\
        \ --wasm \"$wasm\" --output json-formatted > \"$out\"\n  echo \"ABI for ${contract}\
        \ (diff this output across commits to detect breaking changes):\"\n  cat \"\
        $out\"\n  echo \"\"\ndone\n"
    - name: Validate ABI JSON is parseable
      run: "set -euo pipefail\nfor contract in registration verification progress\
        \ scout_access; do\n  out=\"abi/${contract}-abi.json\"\n  python3 -c \"import\
        \ json, sys; json.load(open('${out}')); print('${contract}: valid JSON')\"\
        \ndone\n"
    - name: Measure optimized WASM size
      run: "set -euo pipefail\nWASM=target/wasm32v1-none/release\necho '{}' > abi/wasm-sizes.json\n\
        for contract in registration verification progress scout_access; do\n  wasm_src=\"\
        ${WASM}/promiscope_${contract}.wasm\"\n  wasm_opt=\"${WASM}/promiscope_${contract}.optimized.wasm\"\
        \n  echo \"==> Optimizing ${contract}...\"\n  stellar contract optimize --wasm\
        \ \"$wasm_src\" --wasm-out \"$wasm_opt\"\n  size=$(wc -c < \"$wasm_opt\" |\
        \ tr -d ' ')\n  echo \"    ${contract}: ${size} bytes (optimized)\"\n  python3\
        \ scripts/record_wasm_sizes.py \"${contract}\"\ndone\necho \"\"\necho \"==>\
        \ abi/wasm-sizes.json:\"\ncat abi/wasm-sizes.json\n"
    - name: Check WASM size budget
      run: "set -euo pipefail\npython3 - <<'PYEOF'\nimport json\nimport sys\n\nwith\
        \ open(\"abi/wasm-sizes.json\") as f:\n    measured = json.load(f)\nwith open(\"\
        ci/wasm-size-budget.json\") as f:\n    budget = json.load(f)[\"budgets\"]\n\
        \nfailed = []\nprint(f\"{'contract':<14} {'measured':>10} {'budget':>10} {'headroom':>10}\"\
        )\nfor contract, cap in sorted(budget.items()):\n    size = measured.get(contract)\n\
        \    if size is None:\n        failed.append(f\"{contract}: no measured size\
        \ found (build/optimize step may have failed)\")\n        continue\n    headroom\
        \ = cap - size\n    print(f\"{contract:<14} {size:>10} {cap:>10} {headroom:>10}\"\
        )\n    if size > cap:\n        over_by = size - cap\n        pct = (over_by\
        \ / cap) * 100\n        failed.append(\n            f\"{contract}: optimized\
        \ WASM is {size} bytes, \"\n            f\"exceeding the {cap}-byte budget\
        \ by {over_by} bytes ({pct:.1f}% over). \"\n            f\"See ci/wasm-size-budget.json\
        \ for how to raise this budget \"\n            f\"if the growth is intentional.\"\
        \n        )\n\nif failed:\n    print(\"\")\n    print(\"FAIL: WASM size budget\
        \ exceeded:\")\n    for msg in failed:\n        print(f\"  - {msg}\")\n  \
        \  sys.exit(1)\n\nprint(\"\")\nprint(\"All contracts within their WASM size\
        \ budget.\")\nPYEOF\n"
    - name: Upload ABI and size-budget artifacts
      uses: actions/upload-artifact@v4
      with:
        name: contract-abis-${{ github.sha }}
        path: abi/*.json
        if-no-files-found: error
  abi-diff:
    name: ABI Diff Gate
    runs-on: ubuntu-latest
    needs: abi-export
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch base branch ABI files
      run: "set -euo pipefail\nBASE_REF=\"${{ github.base_ref }}\"\nif [[ -z \"$BASE_REF\"\
        \ ]]; then\n  BASE_REF=\"main\"\nfi\necho \"Base ref: $BASE_REF\"\ngit fetch\
        \ origin \"$BASE_REF\" --depth=1 || true\nmkdir -p abi/base\nfor contract\
        \ in registration verification progress scout_access; do\n  if git show \"\
        origin/$BASE_REF:abi/${contract}-abi.json\" > \"abi/base/${contract}-abi.json\"\
        \ 2>/dev/null; then\n    echo \"  Fetched base ABI for $contract\"\n  else\n\
        \    echo \"  No base ABI found for $contract (treating as new)\"\n    echo\
        \ \"{}\" > \"abi/base/${contract}-abi.json\"\n  fi\ndone\n"
    - name: Run ABI diff gate
      run: bash scripts/check-abi-diff.sh origin/${{ github.base_ref || 'main' }}
    - name: Upload ABI diff report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: abi-diff-report-${{ github.sha }}
        path: abi/*.json
        if-no-files-found: ignore
  budget-calibration:
    name: Budget Calibration
    runs-on: ubuntu-latest
    needs:
    - test
    - abi-export
    steps:
    - uses: actions/checkout@v4
    - name: Download ABI artifact
      uses: actions/download-artifact@v4
      with:
        name: contract-abis-${{ github.sha }}
        path: abi/
    - name: Download CPU-cost budget report artifact
      uses: actions/download-artifact@v4
      with:
        name: cpu-cost-budget-${{ github.sha }}
        path: .
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Run budget calibration
      run: 'set -euo pipefail

        python scripts/calibrate-budgets.py --headroom 0.20

        '
    - name: Run calibrate-budgets.py test suite
      run: 'set -euo pipefail

        python3 -m pip install --quiet pytest

        python3 -m pytest scripts/tests/test_calibrate_budgets.py -v

        '
    - name: Check for drift between measured and budgeted values
      run: "set -euo pipefail\npython3 - <<'PYEOF'\nimport json, sys\n\nwith open(\"\
        abi/wasm-sizes.json\") as f:\n    measured = json.load(f)\nwith open(\"ci/wasm-size-budget.json\"\
        ) as f:\n    budget = json.load(f)[\"budgets\"]\n\nfailed = []\nfor contract,\
        \ cap in sorted(budget.items()):\n    size = measured.get(contract)\n    if\
        \ size is None:\n        failed.append(f\"{contract}: no measured size found\"\
        )\n        continue\n    headroom = cap - size\n    pct = (headroom / cap)\
        \ * 100 if cap else 0\n    print(f\"  {contract:<14} measured={size:>8}  budget={cap:>8}\
        \  headroom={headroom:>8}  ({pct:.1f}%)\")\n    if size > cap:\n        failed.append(\n\
        \            f\"{contract}: measured {size} bytes exceeds budget {cap} bytes\"\
        \n        )\n\nif failed:\n    print(\"\")\n    print(\"FAIL: measured values\
        \ exceed current budgets:\")\n    for msg in failed:\n        print(f\"  -\
        \ {msg}\")\n    sys.exit(1)\n\nprint(\"\")\nprint(\"All measured values are\
        \ within budget.\")\nPYEOF\n"
  supply-chain:
    name: Supply-chain & License Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        targets: wasm32v1-none
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target

          '
        key: ${{ runner.os }}-cargo-wasm32v1-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-deny
      run: 'set -euo pipefail

        command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked

        '
    - name: Pin ed25519-dalek to match workspace override
      run: cargo update -p ed25519-dalek@3.0.0 --precise 3.0.0-rc.0 || true
    - name: Run cargo-deny check
      run: cargo deny check advisories bans licenses sources
