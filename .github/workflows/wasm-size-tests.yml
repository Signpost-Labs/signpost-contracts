name: WASM size recorder regressions
on:
  pull_request:
    paths:
      - scripts/record_wasm_sizes.py
      - scripts/tests/test_record_wasm_sizes.py
      - .github/workflows/wasm-size-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/record_wasm_sizes.py
      - scripts/tests/test_record_wasm_sizes.py
      - .github/workflows/wasm-size-tests.yml
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline optimizer failure handling
        run: python -m unittest discover -s scripts/tests -p test_record_wasm_sizes.py -v
