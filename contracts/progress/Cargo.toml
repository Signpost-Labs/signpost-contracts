[package]
name = "promiscope-progress"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
promiscope-shared-types = { path = "../shared-types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
promiscope-verification = { path = "../verification" }
promiscope-registration = { path = "../registration" }
