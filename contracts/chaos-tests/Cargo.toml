[package]
name = "promiscope-chaos-tests"
version.workspace = true
edition.workspace = true
# fixtures.rs / invariants.rs / schedule.rs are modules of chaos_schedules.rs,
# not standalone integration tests.
autotests = false

[lib]
crate-type = ["rlib"]

[[test]]
name = "chaos_schedules"
path = "tests/chaos_schedules.rs"

[dependencies]
soroban-sdk = { workspace = true }
promiscope-registration = { path = "../registration" }
promiscope-verification = { path = "../verification" }
promiscope-progress = { path = "../progress" }
promiscope-scout-access = { path = "../scout_access" }
promiscope-shared-types = { path = "../shared-types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
